<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nightly</title>
<meta name="description" content="A ten-second end-of-day check-in.">
<meta name="theme-color" content="#0e0f16">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nightly">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<header class="topbar">
  <button class="icon-btn" data-action="open-history" aria-label="History">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10.2h17"/></svg>
  </button>
  <span class="wordmark">Nightly</span>
  <button class="icon-btn" data-action="open-settings" aria-label="Settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5h9M18.5 7.5h2M3.5 16.5h2M10.5 16.5h10"/><circle cx="15.5" cy="7.5" r="2.4"/><circle cx="7.5" cy="16.5" r="2.4"/></svg>
  </button>
</header>

<main id="today" class="screen"></main>

<section class="sheet" id="sheet-history" aria-hidden="true" aria-label="History">
  <header class="sheet-bar">
    <span class="sheet-title">Your nights</span>
    <button class="text-btn" data-action="close-sheet">Done</button>
  </header>
  <div class="sheet-body" id="history-body"></div>
</section>

<section class="sheet" id="sheet-settings" aria-hidden="true" aria-label="Settings">
  <header class="sheet-bar">
    <span class="sheet-title">Settings</span>
    <button class="text-btn" data-action="close-sheet">Done</button>
  </header>
  <div class="sheet-body" id="settings-body"></div>
</section>

<section class="sheet" id="sheet-edit" aria-hidden="true" aria-label="Edit a day">
  <header class="sheet-bar">
    <button class="text-btn" data-action="close-sheet">Close</button>
    <span class="sheet-title" id="edit-title"></span>
    <span class="text-btn placeholder" aria-hidden="true">Close</span>
  </header>
  <div class="sheet-body" id="edit-body"></div>
</section>

<div class="overlay" id="confirm" aria-hidden="true">
  <div class="overlay-inner">
    <div class="overlay-moon">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.6 8.6 0 0 1 9.2 4a8.6 8.6 0 1 0 10.8 10.5Z" fill="currentColor" stroke="none"/></svg>
    </div>
    <p class="overlay-line" id="confirm-line"></p>
    <p class="overlay-sub">Goodnight.</p>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
